<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="dt dd">
  <title id="dt">Defense in depth</title>
  <desc id="dd">Legitimate traffic flows from the internet through ingress to the API and database. An attacker going straight for the database and a scan job trying to reach the internet are both denied by default-deny NetworkPolicies.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1A20"/><stop offset="0.55" stop-color="#132C35"/><stop offset="1" stop-color="#1D4250"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7FDBCA" stroke-opacity="0.07"/></pattern><clipPath id="card"><rect width="1200" height="400" rx="18"/></clipPath></defs>
  <style>
    .t { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #E6EDF3; }
    .s { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #7C949D; }
    .lbl { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; fill: #5EEAD4; }
    .deny { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #FF7B72; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <g clip-path="url(#card)"><rect width="1200" height="400" fill="url(#bg)"/><rect width="1200" height="400" fill="url(#grid)"/></g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="18" fill="none" stroke="#7FDBCA" stroke-opacity="0.18"/>

  <!-- cluster boundary -->
  <rect x="240" y="58" width="930" height="300" rx="16" fill="#0B1A20" fill-opacity="0.45" stroke="#5EEAD4" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <text x="262" y="84" class="lbl">kubernetes · namespace secureship · default-deny</text>
  <text x="32" y="38" class="lbl" fill="#5EEAD4">$ kubectl get networkpolicy</text>
  <text x="1168" y="38" text-anchor="end" class="s">only what is allowed gets through</text>

  <!-- allowed routes -->
  <path d="M157 190 H295" stroke="#5EEAD4" stroke-opacity="0.45" stroke-width="2.5" class="flow" fill="none"/>
  <path d="M435 190 H540" stroke="#5EEAD4" stroke-opacity="0.45" stroke-width="2.5" class="flow" fill="none"/>
  <path d="M680 190 L800 125" stroke="#5EEAD4" stroke-opacity="0.45" stroke-width="2.5" class="flow" fill="none"/>
  <path d="M680 190 L800 268" stroke="#5EEAD4" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="3 6" fill="none"/>

  <!-- walls -->
  <line x1="700" y1="262" x2="700" y2="345" stroke="#F85149" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
  <text x="712" y="342" class="s" fill="#FF7B72">netpol: deny</text>
  <line x1="1085" y1="200" x2="1085" y2="300" stroke="#F85149" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
  <text x="1085" y="322" text-anchor="middle" class="s" fill="#FF7B72">egress: deny</text>

  
  <g transform="translate(105 190)">
    <circle r="50" fill="#2B1418" fill-opacity="0.6" stroke="#F85149" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M-24 6 a14 14 0 0 1 4 -27 a18 18 0 0 1 33 4 a12 12 0 0 1 11 23 z" fill="none" stroke="#FF7B72" stroke-width="3" stroke-linejoin="round"/>
    <text y="82" text-anchor="middle" class="t">internet</text><text y="102" text-anchor="middle" class="s">untrusted</text>
  </g>
  <g transform="translate(365 190)">
    <rect x="-70" y="-30" width="140" height="60" rx="12" fill="#10252C" stroke="#5EEAD4" stroke-opacity="0.75" stroke-width="2"/>
    <text y="6" text-anchor="middle" class="t">ingress-nginx</text>
    <text y="52" text-anchor="middle" class="s">rate limits · headers</text>
  </g>
  <g transform="translate(610 190)">
    <rect x="-70" y="-30" width="140" height="60" rx="12" fill="#10252C" stroke="#5EEAD4" stroke-opacity="0.75" stroke-width="2"/>
    <text y="6" text-anchor="middle" class="t">api</text>
    <text y="52" text-anchor="middle" class="s">non-root · read-only</text>
  </g>
  <g transform="translate(870 125)">
    <rect x="-70" y="-30" width="140" height="60" rx="12" fill="#10252C" stroke="#5EEAD4" stroke-opacity="0.75" stroke-width="2"/>
    <text y="6" text-anchor="middle" class="t">postgres</text>
    <text y="52" text-anchor="middle" class="s">secret out of git</text>
  </g>
  <g transform="translate(870 268)">
    <rect x="-70" y="-30" width="140" height="60" rx="12" fill="#10252C" stroke="#5EEAD4" stroke-opacity="0.75" stroke-width="2"/>
    <text y="6" text-anchor="middle" class="t">scan job</text>
    <text y="52" text-anchor="middle" class="s">no network · no creds</text>
  </g>

  <!-- legit packets -->
  <circle r="6" fill="#5EEAD4" opacity="0"><animateMotion dur="3.6s" begin="0s" repeatCount="indefinite" path="M157 190 L610 190 L800 125"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="3.6s" begin="0s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#5EEAD4" opacity="0"><animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M157 190 L610 190 L800 125"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#5EEAD4" opacity="0"><animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite" path="M157 190 L610 190 L800 125"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></circle>
  <circle r="4.5" fill="#8FE3D7" opacity="0"><animateMotion dur="4.8s" begin="0.6s" repeatCount="indefinite" path="M157 190 L610 190 L800 268"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="4.8s" begin="0.6s" repeatCount="indefinite"/></circle>

  <!-- attacks -->
  
  <circle r="7" fill="#F85149" opacity="0"><animateMotion dur="5.0s" begin="0.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.55;1" calcMode="linear" path="M157 212 C 300 330, 560 345, 700 300"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.55;0.6;1" dur="5.0s" begin="0.8s" repeatCount="indefinite"/></circle>
  <g transform="translate(700 300)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.57;0.85;1" dur="5.0s" begin="0.8s" repeatCount="indefinite"/>
    <circle r="20" fill="#F85149" fill-opacity="0.18"><animate attributeName="r" values="8;30" dur="5.0s" begin="0.8s" repeatCount="indefinite" keyTimes="0;1" calcMode="spline" keySplines=".2 .8 .2 1"/></circle>
    <path d="M-8 -8 L8 8 M8 -8 L-8 8" stroke="#FF7B72" stroke-width="4" stroke-linecap="round"/>
    <rect x="16" y="-60" width="66" height="26" rx="6" fill="#3A1418" stroke="#F85149" stroke-opacity="0.7"/>
    <text x="24" y="-42" class="deny">DENIED</text>
  </g>
  
  <circle r="7" fill="#F85149" opacity="0"><animateMotion dur="5.0s" begin="3.3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.55;1" calcMode="linear" path="M940 268 C 1000 268, 1040 250, 1085 250"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.55;0.6;1" dur="5.0s" begin="3.3s" repeatCount="indefinite"/></circle>
  <g transform="translate(1085 250)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.57;0.85;1" dur="5.0s" begin="3.3s" repeatCount="indefinite"/>
    <circle r="20" fill="#F85149" fill-opacity="0.18"><animate attributeName="r" values="8;30" dur="5.0s" begin="3.3s" repeatCount="indefinite" keyTimes="0;1" calcMode="spline" keySplines=".2 .8 .2 1"/></circle>
    <path d="M-8 -8 L8 8 M8 -8 L-8 8" stroke="#FF7B72" stroke-width="4" stroke-linecap="round"/>
    <rect x="-91" y="-60" width="75" height="26" rx="6" fill="#3A1418" stroke="#F85149" stroke-opacity="0.7"/>
    <text x="-83" y="-42" class="deny">BLOCKED</text>
  </g>
</svg>
